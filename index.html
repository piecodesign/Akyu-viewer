<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>名人戦A級 5局ビューワー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
<style>
/* 上：ラウンド選択と状態　下：盤の格子（列数は切替可） */
:root{
  --bg:#f2f0ea; --panel:#ffffff; --fg:#1e2220; --muted:#68706b; --line:#d8d3c8;
  --accent:#3d6a4e; --accent-fg:#ffffff; --frame:#e6e1d5;
  --black:#1e2220; --white:#ffffff; --live:#b4521f; --draw:#6b6f8a;
  --font:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#161917; --panel:#202421; --fg:#e6e8e5; --muted:#9aa29d; --line:#363c38;
  --accent:#86b796; --accent-fg:#0f1d14; --frame:#2a2f2b;
  --black:#0b0c0b; --white:#f3f3f1; --live:#e58a57; --draw:#a3a7c6; color-scheme:dark;}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--font)}
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:8px 16px;display:grid;gap:6px}
.row{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
h1{font-size:15px;margin:0;font-weight:700;letter-spacing:.02em}
select,button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:6px;padding:4px 10px;cursor:pointer}
#round{font-weight:700;border-color:var(--accent)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#status{font-size:12px;color:var(--muted)}
#status b{color:var(--fg);font-weight:700}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--live);margin-right:4px;vertical-align:1px}
.spacer{flex:1}
#display{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted)}
#display[hidden]{display:none}
#display label{display:flex;align-items:center;gap:6px}
#display input[type=range]{width:110px;accent-color:var(--accent)}
#display output{min-width:3.4em;font-variant-numeric:tabular-nums;color:var(--fg)}
main{display:grid;gap:10px;padding:10px 16px 16px;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr))}
.slot{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:5px 8px;border-bottom:1px solid var(--line);font-size:13px;min-width:0}
.names{flex:1;min-width:0;display:flex;gap:10px;white-space:nowrap;overflow:hidden}
.p{display:inline-flex;align-items:center;gap:4px}
.stone{width:11px;height:11px;border-radius:50%;border:1px solid var(--fg);flex:none}
.stone.b{background:var(--black)} .stone.w{background:var(--white)}
.chip{font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.chip.live{color:var(--live)} .chip.draw{color:var(--draw)} .chip.black,.chip.white,.chip.done{color:var(--accent)}
.bar a,.bar button{font-size:11px;padding:1px 7px}
.bar a{color:var(--accent)}
.view{position:relative;overflow:hidden;background:var(--frame);height:var(--h,560px)}
.view iframe{position:absolute;left:0;border:0;background:#fff;width:calc(100% / var(--z,1));
  height:calc((var(--h,560px) + var(--off,0px) + var(--adj,0px)) / var(--z,1));top:calc((var(--off,0px) + var(--adj,0px)) * -1);transform:scale(var(--z,1));transform-origin:0 0}
.nudge{display:inline-flex;align-items:center;gap:2px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.nudge button{padding:1px 6px;line-height:1.2}
.nudge output{min-width:2.6em;text-align:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.notice{grid-column:1/-1;color:var(--muted);padding:40px 0;text-align:center}
@media (max-width:700px){main{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="row">
    <h1 id="title">名人戦A級 5局ビューワー</h1>
    <label for="round" class="sr">ラウンド</label>
    <select id="round"></select>
    <span id="status">読み込み中…</span>
    <span class="spacer"></span>
    <button id="reloadAll" type="button">盤を再読み込み</button>
    <button id="toggleDisplay" type="button" aria-expanded="false">表示の調整</button>
  </div>
  <div id="display" hidden>
    <label>列 <select id="cols"><option>1</option><option>2</option><option selected>3</option><option>5</option></select></label>
    <label>縮小 <input id="zoom" type="range" min="40" max="100" value="70"><output id="zoomV"></output></label>
    <label>上を詰める <input id="off" type="range" min="0" max="400" step="10" value="0"><output id="offV"></output></label>
    <label>高さ <input id="hgt" type="range" min="300" max="1000" step="20" value="560"><output id="hgtV"></output></label>
  </div>
</header>
<main id="grid"></main>

<script type="module">
import { groupRounds, outcome } from "./lib.mjs";

const BASE = "https://renjuportal.com/score/";
const POLL_MS = 30000;
const $ = (s) => document.querySelector(s);
const fmt = (d) => new Intl.DateTimeFormat("ja-JP", { timeZone: "Asia/Tokyo", month: "numeric", day: "numeric", weekday: "short", hour: "2-digit", minute: "2-digit" }).format(d);

let config, rounds = {}, shown = null;   // shown: 今表示している棋譜IDの並び
let mode = location.hash.match(/^#r(\d)$/)?.[1] || "live";

async function getJSON(path) {
  const r = await fetch(path + "?t=" + Date.now(), { cache: "no-store" });
  if (!r.ok) throw new Error(path + " を読み込めませんでした");
  return r.json();
}

// 「最新（自動）」で表示するラウンド：棋譜がある最新ラウンドと、
// 開始10分前を過ぎた最新ラウンドの、どちらか新しいほう（棋譜が未着でも開始10分前に切り替える）
const SWITCH_BEFORE_MS = 10 * 60000;
function latestRound() {
  const withGames = config.rounds.filter((r) => rounds[r.no]?.length);
  const byGames = withGames.length ? withGames.at(-1).no : 0;
  const now = Date.now();
  const due = now < Date.parse(config.until)
    ? config.rounds.filter((r) => Date.parse(r.start) - SWITCH_BEFORE_MS <= now) : [];
  const byTime = due.length ? due.at(-1).no : 0;
  return Math.max(byGames, byTime) || null;
}
// 開始時刻（の判定開始）を過ぎたのに棋譜がまだ無いラウンド
function waitingRound(latest) {
  const now = Date.now(), lead = (config.leadMinutes ?? 90) * 60000;
  const due = config.rounds.filter((r) => Date.parse(r.start) - lead <= now && r.no > (latest || 0));
  return due.length && now < Date.parse(config.until) ? due.at(-1) : null;
}

function renderSelect() {
  const sel = $("#round"), latest = latestRound();
  const opts = [`<option value="live">最新（自動）${latest ? "：R" + latest : ""}</option>`];
  for (const r of config.rounds) {
    const n = rounds[r.no]?.length || 0;
    opts.push(`<option value="${r.no}" ${n ? "" : "disabled"}>R${r.no}　${fmt(new Date(r.start))}${n ? "　" + n + "局" : ""}</option>`);
  }
  sel.innerHTML = opts.join("");
  sel.value = mode;
  if (sel.value !== mode) { mode = "live"; sel.value = "live"; }
}

function renderStatus(no) {
  const latest = latestRound(), wait = waitingRound(latest);
  const parts = [];
  if (no) {
    const r = config.rounds.find((x) => x.no === no);
    const list = rounds[no] || [];
    const live = list.some((g) => outcome(g).key === "live");
    if (list.length) parts.push(`<b>R${no}</b> ${fmt(new Date(r.start))}開始 ・ ${list.length}局${live ? ` ・ <span class="dot"></span>対局中あり` : " ・ 全局終了"}`);
    else parts.push(`<b>R${no}</b> ${fmt(new Date(r.start))}開始 ・ 棋譜の登録を待っています（登録されると1分ほどで表示されます）`);
  }
  if (mode === "live" && wait && wait.no !== no) parts.push(`R${wait.no}の棋譜を待っています（登録されると数分で切り替わります）`);
  $("#status").innerHTML = parts.join("　") || "まだ棋譜がありません";
}

function slotHTML(g) {
  const o = outcome(g);
  const bar = document.createElement("div"); bar.className = "bar";
  bar.innerHTML = `<span class="names"><span class="p"><span class="stone b" title="黒"></span>${g.black}</span><span class="p"><span class="stone w" title="白"></span>${g.white}</span></span><span class="chip ${o.key}">${o.label}</span>`;
  return bar;
}

function renderGrid(no) {
  const games = no ? rounds[no] || [] : [];
  const key = games.map((g) => g.sid).join(",");
  const grid = $("#grid");
  if (key === shown) {            // 同じ棋譜なら盤は読み込み直さず、見出し（勝敗）だけ更新
    grid.querySelectorAll(".slot").forEach((el, i) => {
      const bar = slotHTML(games[i]);
      bar.append(...extraButtons(games[i], el.querySelector("iframe")));
      el.replaceChild(bar, el.firstChild);
    });
    return;
  }
  shown = key;
  grid.innerHTML = "";
  if (!games.length) { grid.innerHTML = '<p class="notice">このラウンドの棋譜はまだ登録されていません。登録されると自動で表示されます。</p>'; return; }
  for (const g of games) {
    const slot = document.createElement("div"); slot.className = "slot";
    const view = document.createElement("div"); view.className = "view";
    const fr = document.createElement("iframe");
    fr.src = BASE + g.sid; fr.title = `${g.black} 対 ${g.white}`;
    view.appendChild(fr);
    const bar = slotHTML(g); bar.append(...extraButtons(g, fr));
    slot.append(bar, view); grid.appendChild(slot);
  }
}

// 盤ごとの上下の微調整（RenjuPortal側で盤の上の情報量が棋譜ごとに違うため）。各自のブラウザに保存
function loadAdj() { try { return JSON.parse(localStorage.getItem("m5adj") || "{}"); } catch { return {}; } }
function saveAdj(all) { try { localStorage.setItem("m5adj", JSON.stringify(all)); } catch {} }
function applyAdj(view, px) { view.style.setProperty("--adj", px + "px"); }

function extraButtons(g, fr) {
  const view = fr.parentElement;
  const nudge = document.createElement("span"); nudge.className = "nudge"; nudge.title = "この盤だけ上下に動かす";
  const up = document.createElement("button"); up.type = "button"; up.textContent = "▲"; up.setAttribute("aria-label", "この盤を上へ");
  const out = document.createElement("output");
  const down = document.createElement("button"); down.type = "button"; down.textContent = "▼"; down.setAttribute("aria-label", "この盤を下へ");
  const show = (px) => { out.textContent = px ? (px > 0 ? "+" : "") + px : "0"; applyAdj(view, px); };
  const step = (d) => { const all = loadAdj(); all[g.sid] = (all[g.sid] || 0) + d; if (!all[g.sid]) delete all[g.sid]; saveAdj(all); show(all[g.sid] || 0); };
  up.onclick = () => step(10);     // 盤を上へ＝上を多めに詰める
  down.onclick = () => step(-10);
  show(loadAdj()[g.sid] || 0);
  nudge.append(up, out, down);

  const rl = document.createElement("button"); rl.type = "button"; rl.textContent = "再読込";
  rl.onclick = () => { fr.src = BASE + g.sid + "?t=" + Date.now(); };
  const a = document.createElement("a"); a.href = BASE + g.sid; a.target = "_blank"; a.rel = "noopener"; a.textContent = "開く";
  return [nudge, rl, a];
}

function render() {
  renderSelect();
  const no = mode === "live" ? latestRound() : Number(mode);
  renderStatus(no);
  renderGrid(no);
}

async function refresh() {
  try {
    const data = await getJSON("data/games.json");
    rounds = groupRounds(data.games || [], config);
    render();
  } catch (e) {
    $("#status").textContent = "棋譜一覧を読み込めませんでした。少し待ってから再読み込みしてください。";
  }
}

$("#round").addEventListener("change", (e) => {
  mode = e.target.value;
  history.replaceState(null, "", mode === "live" ? location.pathname : "#r" + mode);
  render();
});
$("#reloadAll").onclick = () => document.querySelectorAll("#grid iframe").forEach((f) => { f.src = f.src.split("?")[0] + "?t=" + Date.now(); });
$("#toggleDisplay").onclick = (e) => { const d = $("#display"); d.hidden = !d.hidden; e.target.setAttribute("aria-expanded", String(!d.hidden)); };

// 表示の調整（各自のブラウザに保存）
const ctl = ["zoom", "off", "hgt", "cols"];
try { const p = JSON.parse(localStorage.getItem("m5prefs") || "{}"); ctl.forEach((k) => p[k] != null && ($("#" + k).value = p[k])); } catch {}
function applyPrefs() {
  const v = Object.fromEntries(ctl.map((k) => [k, $("#" + k).value]));
  const st = document.documentElement.style;
  st.setProperty("--z", v.zoom / 100); st.setProperty("--off", v.off + "px"); st.setProperty("--h", v.hgt + "px");
  $("#grid").style.setProperty("--cols", v.cols);
  $("#zoomV").textContent = v.zoom + "%"; $("#offV").textContent = v.off + "px"; $("#hgtV").textContent = v.hgt + "px";
  try { localStorage.setItem("m5prefs", JSON.stringify(v)); } catch {}
}
ctl.forEach((k) => $("#" + k).addEventListener("input", applyPrefs));
applyPrefs();

try {
  config = await getJSON("config.json");
  $("#title").textContent = config.title + " 5局ビューワー";
  document.title = config.title + " 5局ビューワー";
  await refresh();
  setInterval(refresh, POLL_MS);
} catch (e) {
  $("#status").textContent = "設定ファイルを読み込めませんでした。";
}
</script>
</body>
</html>
