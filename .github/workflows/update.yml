name: 棋譜一覧の更新と公開

on:
  schedule:
    - cron: "*/5 * * * *"   # 5分おき（GitHubの都合で数分遅れることがあります）
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: RenjuPortal から棋譜一覧を取得
        run: node scripts/update-games.mjs

      - name: 変化があれば保存
        id: commit
        run: |
          if git diff --quiet -- data/games.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/games.json
            git commit -m "棋譜一覧を更新"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 公開用ファイルを準備
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: GitHub Pages に公開
        id: deploy
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/deploy-pages@v4
