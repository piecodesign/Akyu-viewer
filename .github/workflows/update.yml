name: ページの公開

# 棋譜一覧の取得は poller.yml が担当し、変化があるとこのワークフローを呼び出す。
# ファイルを直接編集したとき（push）にも公開し直す。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: GitHub Pages に公開
        id: deploy
        uses: actions/deploy-pages@v4
